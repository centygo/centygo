name: WakaTime Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  update-wakatime:
    runs-on: ubuntu-latest
    name: Update WakaTime Stats
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run WakaTime update script
        run: node scripts/update-wakatime.js
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

      # --- PASSO DE DEBUG ADICIONADO ---
      # Este passo vai mostrar o conteúdo do README.md após o script rodar.
      - name: Verify README content
        run: |
          echo "--- README.md content after script execution ---"
          cat README.md
          echo "------------------------------------------------"

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: update wakatime stats'
          file_pattern: README.md
